# Alembic — the schema's version history (roadmap #20, 2026-09-21).
#
# The URL is not here: migrations/env.py reads DATABASE_URL through
# app.config, so the CLI and the app always look at the same database.
#
#   alembic current                    what the database is at
#   alembic revision --autogenerate -m "add x"   a new migration from the models
#   alembic upgrade head               apply (the app does this at boot too)
[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
