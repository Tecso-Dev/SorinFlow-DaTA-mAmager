name: Build & Deploy to Kubernetes

on:
  push:
    branches:
      - main
  # Run the gate on pull requests too. Without this a PR got no checks at all
  # and the suite only ran after merging — which is the one moment it is too
  # late to learn something is broken. build and deploy stay push-only below,
  # so a pull request is tested and never shipped.
  # No branch filter: stacked PRs target another PR's branch rather than main,
  # and those are exactly the ones that most need testing before they are
  # chained together.
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tecso-dev/sorinflow-data-manager

jobs:
  # Nothing reaches the registry until the suite is green. Without this gate a
  # parser regression or a broken auth dependency shipped straight to the
  # scraper fleet on every push to main.
  test:
    runs-on: ubuntu-latest

    # A real Postgres, not SQLite. The models are Postgres-specific — scraping_jobs
    # .job_id is a postgresql UUID column — so a SQLite run either fails to build
    # the schema or quietly exercises a different dialect than production. Redis
    # is here for the same reason: verification codes and login throttling live in
    # it, and a fake would not prove the real client works.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sorinflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sorinflow_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # requirements-dev.txt pulls requirements.txt plus the test-only
        # packages, so this gate installs exactly what a developer installs —
        # a hand-kept list here would drift from what the app actually needs.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://sorinflow:ci-only-password@localhost:5432/sorinflow_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-only-not-a-real-secret-0123456789
          LOGS_PATH: /tmp
          IMAGES_PATH: /tmp
        run: pytest tests/ -q

      - name: Verify the auth migration against a live Postgres
        # Skipped without PG_TEST_URL, so it only runs where a database exists.
        # This is the half SQLite can never cover: ALTER ... IF NOT EXISTS is a
        # no-op there, so the DDL production runs would go untested.
        env:
          PG_TEST_URL: postgresql+asyncpg://sorinflow:ci-only-password@localhost:5432/sorinflow_test
          SECRET_KEY: ci-only-not-a-real-secret-0123456789
          LOGS_PATH: /tmp
          IMAGES_PATH: /tmp
        run: pytest tests/test_pg_migration.py -q

  # Build on a GitHub-hosted runner (plenty of RAM, outbound to ghcr works).
  build:
    runs-on: ubuntu-latest
    needs: test
    # Never from a pull request: building would push an image to the registry
    # tagged with a SHA that may never reach main.
    if: github.event_name != 'pull_request' 
    permissions:
      contents: read
      packages: write
    outputs:
      image_sha: ${{ steps.sha.outputs.short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  # Deploy on the self-hosted runner ON the server. The datacenter blocks
  # inbound SSH from foreign IPs, so a GitHub-hosted runner cannot reach the
  # box. The self-hosted runner connects outbound to GitHub, pulls the image
  # (server outbound to ghcr works) straight into k3s containerd, and rolls out.
  deploy:
    runs-on: [self-hosted, sorinflow]
    needs: build
    if: github.event_name != 'pull_request' 
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull image into k3s containerd
        run: |
          IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_sha }}"
          echo "Pulling $IMAGE into containerd (k8s.io namespace)..."
          k3s ctr -n k8s.io images pull \
            --user "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "$IMAGE"

      - name: Apply ingress manifests
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        # --validate=false skips the client-side schema check, which downloads
        # the OpenAPI document from the API server first. That download keeps
        # timing out on this node and failing deploys whose manifests had not
        # even changed. The apiserver still validates on admission, so the
        # manifest is not going in unchecked — only the local pre-check is
        # dropped. Retried once, because the same node hiccup can hit the apply.
        run: |
          kubectl apply --validate=false -f k8s/05-ingress.yaml ||
            { sleep 10; kubectl apply --validate=false -f k8s/05-ingress.yaml; }

      - name: Roll out new image
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_sha }}"
          kubectl set image deployment/backend backend="$IMAGE" -n sorinflow
          kubectl rollout status deployment/backend -n sorinflow --timeout=300s
          kubectl get pods -n sorinflow
