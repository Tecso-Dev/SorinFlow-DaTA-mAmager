name: Build & Deploy to Kubernetes

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tecso-dev/sorinflow-data-manager

jobs:
  # Lint + the full test suite (Postgres, Redis, pip-audit, the Telegram relay
  # Worker, the live-Postgres migration check) — moved to its own workflow so
  # a push or a pull request gets exactly the same gate without also being
  # able to build or deploy. Called here too so main's own push runs it one
  # more time before build even though ci.yml already ran it for the PR that
  # merged into main.
  ci:
    uses: ./.github/workflows/ci.yml

  # Owned by another stream — see .github/workflows/e2e.yml.
  e2e:
    uses: ./.github/workflows/e2e.yml

  # Owned by another stream — see .github/workflows/k8s.yml.
  k8s:
    uses: ./.github/workflows/k8s.yml

  # Build on a GitHub-hosted runner (plenty of RAM, outbound to ghcr works).
  build:
    runs-on: ubuntu-latest
    needs: [ci, e2e, k8s]
    # Never from a pull request: building would push an image to the registry
    # tagged with a SHA that may never reach main. Never from any other
    # branch either: a workflow_dispatch run on a feature branch used to
    # reach this job and build+push+deploy that branch's code to production.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image_sha: ${{ steps.sha.outputs.short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  # Deploy on the self-hosted runner ON the server. The datacenter blocks
  # inbound SSH from foreign IPs, so a GitHub-hosted runner cannot reach the
  # box. The self-hosted runner connects outbound to GitHub, pulls the image
  # (server outbound to ghcr works) straight into k3s containerd, and rolls out.
  deploy:
    runs-on: [self-hosted, sorinflow]
    needs: build
    # Same guard as build: without github.ref, a workflow_dispatch on any
    # branch would roll that branch out to the production cluster.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull image into k3s containerd
        # Retried, because this is the one step that depends on a network the
        # project does not control: a server in Iran reaching ghcr.io. A single
        # DNS blip — "lookup ghcr.io: Try again" — has already failed a deploy
        # whose tests and build both passed, and the image was fine.
        #
        # Backoff rather than a tight loop: if the registry is genuinely
        # unreachable, hammering it neither helps nor tells us anything new.
        # Six attempts over ~5 minutes covers a transient outage without
        # sitting on the runner for an hour when the problem is real.
        timeout-minutes: 20
        run: |
          IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_sha }}"
          echo "Pulling $IMAGE into containerd (k8s.io namespace)..."

          for attempt in 1 2 3 4 5 6; do
            if k3s ctr -n k8s.io images pull \
                 --user "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
                 "$IMAGE"; then
              echo "Pulled on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then break; fi
            delay=$(( attempt * 20 ))
            echo "Attempt $attempt failed — retrying in ${delay}s."
            # A failed resolve can leave a stale negative DNS answer cached;
            # a fresh lookup on the next attempt is the point of the wait.
            getent hosts ghcr.io >/dev/null 2>&1 || echo "  (ghcr.io still not resolving)"
            sleep "$delay"
          done

          echo "::error::Could not pull $IMAGE after 6 attempts."
          echo "The image built and pushed successfully — this is the server"
          echo "failing to reach ghcr.io. The running pod is untouched."
          exit 1

      # Secrets that are managed in GitHub (Settings → Secrets and variables →
      # Actions) are copied into the cluster Secret on every deploy, before the
      # manifests create the new pod that reads them. A GitHub secret that is
      # not set leaves the cluster value alone — a missing entry must never
      # blank a key that was patched by hand on the server. Values are only
      # ever passed to kubectl; nothing here prints one (GitHub masks them in
      # the log anyway). To manage another key this way, add its name to LIST
      # — and, if it is new, wire it in k8s/04-backend.yaml (SECRETS.md §2).
      - name: Sync secrets from GitHub
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          DR_BACKUP_PASSPHRASE: ${{ secrets.DR_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          LIST="LLM_API_KEY LLM_BASE_URL LLM_MODEL LIARA_API_TOKEN DR_BACKUP_PASSPHRASE"
          patch="{}"
          for name in $LIST; do
            val="${!name:-}"
            if [ -z "$val" ]; then
              echo "$name: not set in GitHub — cluster value left as is"
              continue
            fi
            patch="$(jq -cn --argjson p "$patch" --arg k "$name" --arg v "$val" '$p + {($k): $v}')"
            echo "$name: synced"
          done
          if [ "$patch" = "{}" ]; then
            echo "Nothing to sync."
            echo "SECRETS_HASH=unsynced" >> "$GITHUB_ENV"
          else
            kubectl patch secret sorinflow-secrets -n sorinflow \
              -p "$(jq -cn --argjson p "$patch" '{stringData: $p}')" >/dev/null
            # A fingerprint of the values, for the pod template (see the
            # annotation in 04-backend.yaml): same values, same pod; a changed
            # value, a recreated pod that reads it. Not reversible.
            hash="$(printf '%s' "$patch" | sha256sum | cut -c1-16)"
            echo "SECRETS_HASH=$hash" >> "$GITHUB_ENV"
          fi

      - name: Apply manifests
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        # --validate=false skips the client-side schema check, which downloads
        # the OpenAPI document from the API server first. That download keeps
        # timing out on this node and failing deploys whose manifests had not
        # even changed. The apiserver still validates on admission, so the
        # manifest is not going in unchecked — only the local pre-check is
        # dropped. Retried once, because the same node hiccup can hit the apply.
        #
        # 04-backend.yaml is applied here too. It used not to be, so every
        # change to it — secret wiring, probes, resources, update strategy —
        # sat in the repo doing nothing until somebody remembered to apply it
        # by hand, and the cluster quietly drifted from what the repo claimed
        # was true. Wiring it in is the only way that stops recurring.
        #
        # It cannot be applied as it stands: the manifest carries a placeholder
        # `:latest` tag, and with imagePullPolicy IfNotPresent that either
        # reuses whatever stale blob is cached under that name — shipping old
        # code while reporting a healthy rollout — or wedges in ErrImagePull.
        # So the image this run actually built is rendered into it first.
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_sha }}"

          RENDERED="$(mktemp)"
          sed -E -e "s|^([[:space:]]*image: )ghcr\.io/tecso-dev/sorinflow-data-manager:.*|\1${IMAGE}|" \
                 -e "s|^([[:space:]]*sorinflow\.com/synced-secrets: ).*|\1\"${SECRETS_HASH:-unsynced}\"|" \
            k8s/04-backend.yaml > "$RENDERED"

          # If that image line is ever renamed the sed silently matches nothing
          # and we would apply :latest — the exact failure this guard exists to
          # prevent. Stop loudly instead of deploying the wrong thing.
          grep -qF "image: ${IMAGE}" "$RENDERED" || {
            echo "::error::Could not render the image into k8s/04-backend.yaml."
            echo "Its image line no longer matches the expected pattern; applying"
            echo "the manifest unchanged would reset the deployment to :latest."
            exit 1
          }
          grep -qF "sorinflow.com/synced-secrets: \"${SECRETS_HASH:-unsynced}\"" "$RENDERED" || {
            echo "::error::Could not render the secrets fingerprint into k8s/04-backend.yaml."
            echo "A changed key would then not restart the pod that reads it."
            exit 1
          }

          kubectl apply --validate=false -f "$RENDERED" ||
            { sleep 10; kubectl apply --validate=false -f "$RENDERED"; }
          kubectl apply --validate=false -f k8s/05-ingress.yaml ||
            { sleep 10; kubectl apply --validate=false -f k8s/05-ingress.yaml; }

          # Postgres and Redis, which CI did not apply until now.
          #
          # That gap was not cosmetic. Their resource limits lived in git and
          # never reached the cluster, so both stayed BestEffort — the first
          # pods the kubelet evicts under node memory pressure — while the
          # backend's limit was raised on the strength of those very limits
          # existing. The backend could grow into memory the node did not have
          # and the eviction would land on the database.
          #
          # apply is idempotent: an unchanged manifest is a no-op and restarts
          # nothing. Only a real spec change causes a restart, which is what it
          # should do.
          # The remaining three as well (roadmap #12): the namespace, the
          # Postgres init ConfigMap and the Traefik ACME config. All
          # idempotent; the ACME config only re-renders Traefik when it
          # actually changed. Nothing in the repo drifts from the cluster
          # any more.
          for m in k8s/00-namespace.yaml k8s/02b-postgres-init-configmap.yaml \
                   k8s/02-postgres.yaml k8s/03-redis.yaml k8s/06-traefik-acme.yaml; do
            kubectl apply --validate=false -f "$m" ||
              { sleep 10; kubectl apply --validate=false -f "$m"; }
          done

      - name: Roll out new image
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_sha }}"
          kubectl set image deployment/backend backend="$IMAGE" -n sorinflow
          if ! kubectl rollout status deployment/backend -n sorinflow --timeout=300s; then
            # The strategy is Recreate: the old pod is already gone, so a new
            # pod that never comes up is the site being DOWN, not a failed
            # canary. On 2026-09-18 an import-time error crash-looped the only
            # pod for fifteen minutes until somebody rolled back by hand.
            # Roll back here, first, and only then explain.
            echo "::error::The new pod did not become ready — rolling back to the previous image."
            kubectl rollout undo deployment/backend -n sorinflow
            kubectl rollout status deployment/backend -n sorinflow --timeout=300s \
              && echo "Rolled back; the site is up on the previous image." \
              || echo "::error::The rollback did not come up either — look at the pods NOW."
            exit 1
          fi
          kubectl get pods -n sorinflow

      # `kubectl get pods` above only ever runs when the rollout succeeded,
      # which is precisely when nobody needs it. The 65048fc failure printed
      # five minutes of "1 old replicas are pending termination" and not one
      # word about why the new pod was unhealthy.
      - name: Why the rollout failed
        if: failure()
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          echo "::group::pods"
          kubectl get pods -n sorinflow -o wide || true
          echo "::endgroup::"
          echo "::group::new pod description (events at the bottom)"
          POD=$(kubectl get pods -n sorinflow -l app=backend \
                --sort-by=.metadata.creationTimestamp -o name | tail -1)
          kubectl describe "$POD" -n sorinflow || true
          echo "::endgroup::"
          echo "::group::new pod logs"
          kubectl logs "$POD" -n sorinflow --tail=120 || true
          kubectl logs "$POD" -n sorinflow --previous --tail=60 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::sessions holding locks (the deadlock that bit us before)"
          kubectl exec -n sorinflow postgres-0 -- psql -U sorinflow -d divar_scraper -c \
            "SELECT pid, state, wait_event_type, left(query,80) AS query,
                    now()-state_change AS held
             FROM pg_stat_activity
             WHERE state <> 'idle' OR state = 'idle in transaction'
             ORDER BY state_change;" || true
          echo "::endgroup::"

      # Installs/refreshes the nightly disaster-recovery backup timer (and the
      # panel's «همین حالا» watcher) on the host — idempotent, so an unchanged
      # scripts/dr_backup.sh or deploy/systemd/* is a no-op here. Runs on the
      # self-hosted runner itself, same as every other host command above.
      - name: Install/refresh the disaster-recovery backup timer
        run: bash scripts/install_dr_backup.sh
