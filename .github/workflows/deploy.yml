name: Build & Deploy to Kubernetes

on:
  push:
    branches:
      - main
  # Run the gate on pull requests too. Without this a PR got no checks at all
  # and the suite only ran after merging — which is the one moment it is too
  # late to learn something is broken. build and deploy stay push-only below,
  # so a pull request is tested and never shipped.
  # No branch filter: stacked PRs target another PR's branch rather than main,
  # and those are exactly the ones that most need testing before they are
  # chained together.
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tecso-dev/sorinflow-data-manager

jobs:
  # Nothing reaches the registry until the suite is green. Without this gate a
  # parser regression or a broken auth dependency shipped straight to the
  # scraper fleet on every push to main.
  test:
    runs-on: ubuntu-latest

    # A real Postgres, not SQLite. The models are Postgres-specific — scraping_jobs
    # .job_id is a postgresql UUID column — so a SQLite run either fails to build
    # the schema or quietly exercises a different dialect than production. Redis
    # is here for the same reason: verification codes and login throttling live in
    # it, and a fake would not prove the real client works.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sorinflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sorinflow_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # requirements-dev.lock is compiled (pip-compile/uv pip compile
        # --generate-hashes) from requirements-dev.txt, which itself pulls
        # requirements.txt plus the test-only packages — so this gate installs
        # exactly the hash-pinned closure a developer installs, not a
        # hand-kept list that could drift from what the app actually needs.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: Audit locked dependencies for known vulnerabilities
        # ecdsa's PYSEC-2026-1325 (Minerva timing attack recovering the nonce
        # from ECDSA P-256 signing) has no upstream fix — the maintainers
        # consider side-channel attacks out of scope. python-jose pulls ecdsa
        # unconditionally, but app/auth/jwt.py signs and verifies every token
        # with HS256 (HMAC), never calling into ecdsa's signing path, so it is
        # ignored here instead of leaving the gate permanently red.
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements-dev.lock --ignore-vuln PYSEC-2026-1325

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://sorinflow:ci-only-password@localhost:5432/sorinflow_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-only-not-a-real-secret-0123456789
          LOGS_PATH: /tmp
          IMAGES_PATH: /tmp
        run: pytest tests/ -q

      # The Telegram relay Worker ships to Cloudflare by hand, not from here —
      # which is exactly why its rules (key, bot allow-list, relay-specific
      # errors) are checked on every push instead of on the day it is pasted.
      - name: Test the Telegram relay Worker
        working-directory: deploy/telegram-relay
        run: node --test

      - name: Verify the auth migration against a live Postgres
        # Skipped without PG_TEST_URL, so it only runs where a database exists.
        # This is the half SQLite can never cover: ALTER ... IF NOT EXISTS is a
        # no-op there, so the DDL production runs would go untested.
        env:
          PG_TEST_URL: postgresql+asyncpg://sorinflow:ci-only-password@localhost:5432/sorinflow_test
          SECRET_KEY: ci-only-not-a-real-secret-0123456789
          LOGS_PATH: /tmp
          IMAGES_PATH: /tmp
        run: pytest tests/test_pg_migration.py -q

  # Build on a GitHub-hosted runner (plenty of RAM, outbound to ghcr works).
  build:
    runs-on: ubuntu-latest
    needs: test
    # Never from a pull request: building would push an image to the registry
    # tagged with a SHA that may never reach main. Never from any other
    # branch either: a workflow_dispatch run on a feature branch used to
    # reach this job and build+push+deploy that branch's code to production.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image_sha: ${{ steps.sha.outputs.short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  # Deploy on the self-hosted runner ON the server. The datacenter blocks
  # inbound SSH from foreign IPs, so a GitHub-hosted runner cannot reach the
  # box. The self-hosted runner connects outbound to GitHub, pulls the image
  # (server outbound to ghcr works) straight into k3s containerd, and rolls out.
  deploy:
    runs-on: [self-hosted, sorinflow]
    needs: build
    # Same guard as build: without github.ref, a workflow_dispatch on any
    # branch would roll that branch out to the production cluster.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull image into k3s containerd
        # Retried, because this is the one step that depends on a network the
        # project does not control: a server in Iran reaching ghcr.io. A single
        # DNS blip — "lookup ghcr.io: Try again" — has already failed a deploy
        # whose tests and build both passed, and the image was fine.
        #
        # Backoff rather than a tight loop: if the registry is genuinely
        # unreachable, hammering it neither helps nor tells us anything new.
        # Six attempts over ~5 minutes covers a transient outage without
        # sitting on the runner for an hour when the problem is real.
        timeout-minutes: 20
        run: |
          IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_sha }}"
          echo "Pulling $IMAGE into containerd (k8s.io namespace)..."

          for attempt in 1 2 3 4 5 6; do
            if k3s ctr -n k8s.io images pull \
                 --user "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
                 "$IMAGE"; then
              echo "Pulled on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then break; fi
            delay=$(( attempt * 20 ))
            echo "Attempt $attempt failed — retrying in ${delay}s."
            # A failed resolve can leave a stale negative DNS answer cached;
            # a fresh lookup on the next attempt is the point of the wait.
            getent hosts ghcr.io >/dev/null 2>&1 || echo "  (ghcr.io still not resolving)"
            sleep "$delay"
          done

          echo "::error::Could not pull $IMAGE after 6 attempts."
          echo "The image built and pushed successfully — this is the server"
          echo "failing to reach ghcr.io. The running pod is untouched."
          exit 1

      # Secrets that are managed in GitHub (Settings → Secrets and variables →
      # Actions) are copied into the cluster Secret on every deploy, before the
      # manifests create the new pod that reads them. A GitHub secret that is
      # not set leaves the cluster value alone — a missing entry must never
      # blank a key that was patched by hand on the server. Values are only
      # ever passed to kubectl; nothing here prints one (GitHub masks them in
      # the log anyway). To manage another key this way, add its name to LIST
      # — and, if it is new, wire it in k8s/base/shared-app-env.patch.yaml
      # (SECRETS.md §2).
      - name: Sync secrets from GitHub
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          DR_BACKUP_PASSPHRASE: ${{ secrets.DR_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          LIST="LLM_API_KEY LLM_BASE_URL LLM_MODEL LIARA_API_TOKEN DR_BACKUP_PASSPHRASE"
          patch="{}"
          for name in $LIST; do
            val="${!name:-}"
            if [ -z "$val" ]; then
              echo "$name: not set in GitHub — cluster value left as is"
              continue
            fi
            patch="$(jq -cn --argjson p "$patch" --arg k "$name" --arg v "$val" '$p + {($k): $v}')"
            echo "$name: synced"
          done
          if [ "$patch" = "{}" ]; then
            echo "Nothing to sync."
            echo "SECRETS_HASH=unsynced" >> "$GITHUB_ENV"
          else
            kubectl patch secret sorinflow-secrets -n sorinflow \
              -p "$(jq -cn --argjson p "$patch" '{stringData: $p}')" >/dev/null
            # A fingerprint of the values, for the pod template (see the
            # annotation in 04-backend.yaml): same values, same pod; a changed
            # value, a recreated pod that reads it. Not reversible.
            hash="$(printf '%s' "$patch" | sha256sum | cut -c1-16)"
            echo "SECRETS_HASH=$hash" >> "$GITHUB_ENV"
          fi

      # Host-level, run once per deploy so a change here reaches the server
      # without anyone SSHing in: the kubelet seccomp profile Chromium's
      # sandbox needs (k8s/base/worker.yaml references it by the same path),
      # and closing 6443 to everything except the cluster's own pod/service
      # networks (Sobhan's decision — kubectl from outside was never a
      # supported way to manage this cluster, and the port had no reason to
      # be reachable from the internet at all).
      - name: Host prerequisites
        run: |
          set -euo pipefail

          echo "── seccomp profile for worker's Chromium sandbox ──"
          # k3s's kubelet root-dir defaults to /var/lib/kubelet (confirmed
          # against a live k3s v1.36.2 node); the seccomp/ subdirectory under
          # it does not exist until something creates it.
          install -d -m 0755 /var/lib/kubelet/seccomp/profiles
          install -m 0644 deploy/seccomp/sorinflow-chromium.json \
            /var/lib/kubelet/seccomp/profiles/sorinflow-chromium.json

          echo "── 6443: pod/service networks only, not the world ──"
          if command -v ufw >/dev/null 2>&1 && ufw status | grep -q active; then
            # The allow rules for the cluster's own networks go in FIRST —
            # deleting the world rule before these exist would cut the
            # runner's own kubectl off from the API server it needs for
            # everything below.
            ufw allow from 10.42.0.0/16 to any port 6443 proto tcp comment 'k8s API - pod network'
            ufw allow from 10.43.0.0/16 to any port 6443 proto tcp comment 'k8s API - service network'
            # new_server.sh wrote this as "6443/tcp"; tolerate a bare "6443"
            # too, and tolerate either already being gone — this step is
            # idempotent and re-runs on every deploy.
            ufw delete allow 6443/tcp 2>/dev/null || true
            ufw delete allow 6443 2>/dev/null || true

            echo "── proving pods can still reach the API server ──"
            IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_sha }}"
            kubectl -n kube-system delete pod sorinflow-6443-check --ignore-not-found >/dev/null
            kubectl -n kube-system run sorinflow-6443-check --image="$IMAGE" --restart=Never \
              --command -- sh -c \
              'curl -sS -o /dev/null -w "%{http_code}" --max-time 10 -k https://kubernetes.default.svc/readyz' \
              >/dev/null
            ok=0
            for i in $(seq 1 30); do
              phase="$(kubectl -n kube-system get pod sorinflow-6443-check -o jsonpath='{.status.phase}' 2>/dev/null || true)"
              [ "$phase" = "Succeeded" ] && { ok=1; break; }
              [ "$phase" = "Failed" ] && break
              sleep 2
            done
            kubectl -n kube-system logs sorinflow-6443-check 2>/dev/null || true
            kubectl -n kube-system delete pod sorinflow-6443-check --ignore-not-found >/dev/null 2>&1 || true
            if [ "$ok" != 1 ]; then
              echo "::error::pods could not reach the API server with 6443 closed — reopening it to the world."
              ufw allow 6443/tcp
              exit 1
            fi
          else
            echo "ufw missing or inactive on this host — leaving the firewall untouched."
          fi
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml

      - name: Deploy
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
          OVERLAY: production
        run: |
          IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_sha }}" \
            SECRETS_HASH="${SECRETS_HASH:-unsynced}" \
            bash scripts/deploy_k8s.sh

      # Installs/refreshes the nightly disaster-recovery backup timer (and the
      # panel's «همین حالا» watcher) on the host — idempotent, so an unchanged
      # scripts/dr_backup.sh or deploy/systemd/* is a no-op here. Runs on the
      # self-hosted runner itself, same as every other host command above.
      - name: Install/refresh the disaster-recovery backup timer
        run: bash scripts/install_dr_backup.sh
