name: Build & Deploy to Kubernetes

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tecso-dev/sorinflow-data-manager
  DEPLOY_HOST: 5.160.252.187
  DEPLOY_USER: root

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_sha: ${{ steps.sha.outputs.short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "SSH_OPTS=-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20" >> $GITHUB_ENV

      - name: Import image into the server's containerd (no registry pull on server)
        run: |
          IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_sha }}"
          echo "Pulling $IMAGE on the runner..."
          docker pull "$IMAGE"
          echo "Streaming image to ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} and importing into k3s..."
          docker save "$IMAGE" | gzip -1 | \
            ssh $SSH_OPTS ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "gunzip | /usr/local/bin/k3s ctr -n k8s.io images import -"

      - name: Roll out new image
        run: |
          IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_sha }}"
          ssh $SSH_OPTS ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml && \
             kubectl set image deployment/backend backend=$IMAGE -n sorinflow && \
             kubectl rollout status deployment/backend -n sorinflow --timeout=300s && \
             kubectl get pods -n sorinflow"
