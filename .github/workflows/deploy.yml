name: Build & Deploy to Kubernetes

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tecso-dev/sorinflow-data-manager

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          host: 94.184.6.67
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GIT_ACTOR,COMMIT_SHA
          script: |
            SHORT_SHA="${COMMIT_SHA:0:7}"
            IMAGE="ghcr.io/tecso-dev/sorinflow-data-manager:${SHORT_SHA}"

            # Refresh GHCR pull secret so cluster can pull the new image
            kubectl create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username="$GIT_ACTOR" \
              --docker-password="$GHCR_TOKEN" \
              --namespace=sorinflow \
              --dry-run=client -o yaml | kubectl apply -f -

            # Update backend to new image and wait for rollout
            kubectl set image deployment/backend backend="$IMAGE" -n sorinflow
            kubectl rollout status deployment/backend -n sorinflow --timeout=120s

            echo "=== Pods ==="
            kubectl get pods -n sorinflow
