[tool.ruff]
# The container image is Python 3.10 (see requirements*.lock); lint the
# syntax that version actually accepts, not whatever runs this check.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "ASYNC"]
# Persian strings make a long line normal here — half the panel's API
# responses and log messages are one Persian sentence, and wrapping them
# buys nothing.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to sit in argument defaults — that
# is how the framework is used, not a mutable default. Without this, adding
# one parameter to an existing route's signature fails the gate on B008.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.params.Depends", "fastapi.params.Query"]

[tool.mypy]
python_version = "3.10"
# Most of this codebase (and everything it imports) has no type stubs; without
# this every third-party import is its own error before a single real one.
ignore_missing_imports = true
# Only check the files actually passed in — otherwise mypy walks into every
# module a changed file imports and reports on code the gate never asked
# about. No strict flags: this is a gate on new code, not a rewrite of the
# existing (untyped) codebase.
follow_imports = "silent"
# scripts/ and tests/ are not packages, and a test that imports a script by
# its bare name made mypy see the same file as two modules — «Source file
# found twice» — and stop before checking anything. Mapping every file by
# its path from the repository root keeps one name per file.
explicit_package_bases = true

[tool.coverage.run]
source = ["app"]
