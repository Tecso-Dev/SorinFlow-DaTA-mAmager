apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: sorinflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: sorinflow
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --requirepass
            - $(REDIS_PASSWORD)
            # An unbounded Redis grows until the NODE runs out, and then the
            # kubelet chooses what dies. 200mb is enormous for what this holds
            # — verification codes, per-IP budgets, a little cache.
            - --maxmemory
            - 200mb
            # noeviction, deliberately, NOT allkeys-lru. Everything in here
            # either has a TTL or matters: silently evicting a login code the
            # moment memory got tight would look like the SMS never arrived.
            # Refusing the write is loud, and the callers already handle a
            # Redis that says no.
            - --maxmemory-policy
            - noeviction
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sorinflow-secrets
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          # Was BestEffort, like Postgres — evicted first, and it holds every
          # in-flight login code.
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sorinflow
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  clusterIP: None
