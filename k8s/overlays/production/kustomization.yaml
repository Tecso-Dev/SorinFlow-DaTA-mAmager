# The live site. sorinflow.com, namespace sorinflow — the same names the
# manifests have used since before kustomize existed here, so `kubectl apply`
# keeps updating the objects that are already running instead of creating
# parallel ones.
#
# traefik-acme.yaml is NOT listed here — see the comment in that file for why
# — and is applied separately by scripts/deploy_k8s.sh.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sorinflow

resources:
  - namespace.yaml
  - ../../base
