apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
  namespace: sorinflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: sorinflow
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate.
  #
  # With one replica, RollingUpdate resolves to maxSurge=1/maxUnavailable=0:
  # the new pod must become Ready before the old one is terminated. That has
  # two consequences here, and both have already bitten.
  #
  #   * Both pods mount data-pvc, which is ReadWriteOnce. During the overlap
  #     two processes write /app/data — including the live Divar session files.
  #   * The new pod's startup migrations need locks the old pod is still
  #     holding, so it can never become Ready, so the old pod is never
  #     terminated. Deploys 65048fc and b491c0c both died in that deadlock.
  #
  # Recreate stops the old pod first, releasing its locks and the volume. It
  # costs a few seconds of downtime per deploy, which a single replica has no
  # way to avoid anyway — RollingUpdate here only ever provided the appearance
  # of zero downtime.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Image is imported directly into the node's containerd by CI over SSH,
      # so the kubelet must not try to pull it from the registry.
      containers:
        - name: backend
          image: ghcr.io/tecso-dev/sorinflow-data-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sorinflow-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sorinflow-secrets
                  key: REDIS_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sorinflow-secrets
                  key: SECRET_KEY
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: sorinflow-secrets
                  key: API_KEY
            # Everything below is optional: true on purpose. The pod must start
            # when a key has never been created — that is the normal state for
            # a provider nobody has signed up for yet. Without the entry the
            # variable does not reach the container at all, so `kubectl patch
            # secret` for it is a silent no-op: the value sits in the Secret and
            # the application never sees it.
            - name: SMTP_HOST
              valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: SMTP_HOST, optional: true } }
            - name: SMTP_PORT
              valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: SMTP_PORT, optional: true } }
            - name: SMTP_USER
              valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: SMTP_USER, optional: true } }
            - name: SMTP_PASSWORD
              valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: SMTP_PASSWORD, optional: true } }
            - name: KAVENEGAR_API_KEY
              valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: KAVENEGAR_API_KEY, optional: true } }
            - name: KAVENEGAR_SENDER
              valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: KAVENEGAR_SENDER, optional: true } }
            - name: KAVENEGAR_OTP_TEMPLATE
              valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: KAVENEGAR_OTP_TEMPLATE, optional: true } }
            - name: METRICS_TOKEN
              valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: METRICS_TOKEN, optional: true } }
            - name: TELEGRAM_BOT_TOKEN
              valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: TELEGRAM_BOT_TOKEN, optional: true } }
            - name: TELEGRAM_CHAT_ID
              valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: TELEGRAM_CHAT_ID, optional: true } }
            - name: ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: ROOT_PASSWORD, optional: true } }
            # Read by the seed on an empty database. Without this entry a
            # rebuilt server seeded its super_admin with the placeholder.
            - name: SUPER_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: SUPER_ADMIN_PASSWORD, optional: true } }
            # ── LLM (optional) ──
            # Any OpenAI-compatible endpoint. Liara's AI gateway is one:
            #   LLM_BASE_URL = https://ai.liara.ir/api/v1/<project-id>
            #   LLM_MODEL    = provider/model, e.g. openai/gpt-4.1-mini
            # Read by app/config.py and used by match_service._llm_rerank.
            # These three were missing here, so the key could be set in the
            # Secret and never reach the process — the silent no-op the note
            # above describes.
            - name: LLM_API_KEY
              valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: LLM_API_KEY, optional: true } }
            - name: LLM_BASE_URL
              valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: LLM_BASE_URL, optional: true } }
            - name: LLM_MODEL
              valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: LLM_MODEL, optional: true } }
            # ── proxies ──
            # Default false in config.py. Without this entry the switch could
            # not be thrown from the cluster: a proxy was configured and tested
            # in the panel for days and never used by a single request.
            - name: PROXY_ENABLED
              valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: PROXY_ENABLED, optional: true } }
            # ── phone-side SMS forwarder ──
            # The forwarder app signs each POST with this. Unset = the inbound
            # endpoints answer 503 and codes are entered by hand, as before.
            - name: OTP_INBOUND_SECRET
              valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: OTP_INBOUND_SECRET, optional: true } }
            - name: OTP_RESEND_AFTER_SECONDS
              valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: OTP_RESEND_AFTER_SECONDS, optional: true } }
            # ── the visitor portal ──
            #
            # Ships OFF. With it false, /portal redirects to the dashboard and
            # every /api/public/auth/* endpoint answers 404, so the sign-up
            # flow cannot be reached even by URL. Flip it to "true" only when
            # a delivery channel is actually configured — a portal that takes
            # a registration and then cannot send the code is worse than one
            # that is closed.
            #
            # Not a secret, so it lives here rather than in the Secret. It was
            # missing entirely until now, which meant the switch could not be
            # thrown from the cluster at all.
            - name: PUBLIC_AUTH_ENABLED
              value: "true"
            # Which channel carries the login code. verification.py falls back
            # to the other one if this fails, so this is a preference, not a
            # hard route.
            - name: AUTH_SMS_PROVIDER
              value: "kavenegar"
            - name: ENVIRONMENT
              value: "production"
            # The node's own address, from Kubernetes. It was a hard-coded
            # string, and the monitoring page went on reporting the old
            # server's IP for hours after the move to a new one.
            - name: SERVER_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DOMAIN
              value: "sorinflow.com"
          volumeMounts:
            - name: app-data
              mountPath: /app/data
          # A single replica with no requests is BestEffort, which makes it the
          # first thing the kubelet evicts under node memory pressure — and it
          # is the whole site. The limit is generous because the container runs
          # Chromium in-process for scraping.
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              # 4Gi, and the reason is measured rather than assumed.
              #
              # On the live node (2026-09-15, the 8 GB box):
              #   MemTotal                7936Mi
              #   k3s-server + containerd ~850Mi
              #   Runner.Listener          129Mi   the self-hosted CI runner
              #   traefik + coredns + metrics-server  ~110Mi
              #   postgres + redis         ~60Mi idle, up to 1.3Gi by their limits
              #   ---------------------------------------------
              #   genuinely available    ~6200Mi
              #
              # The limit must stay below what is actually free: the cgroup
              # stops the pod at the limit, but if the limit exceeds free
              # memory the KERNEL OOM killer fires first — and it does not
              # respect Kubernetes QoS, so it could pick Postgres. 4096Mi puts
              # the scraper's 80% recycle at ~3277Mi with two gigabytes to
              # spare. (The previous 4 GB node ran 2560Mi for the same reason.)
              memory: "4096Mi"
          # Startup is create_all plus a migration chain, and its duration is
          # not knowable in advance. Without a startupProbe the liveness probe
          # kills the container ~150s in and it crashloops forever with no way
          # out. This gives boot up to 5 minutes while keeping the liveness
          # probe tight once the app is actually serving.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              # /ready answers 503 while Postgres or Redis is unreachable;
              # /health only says the process is up (roadmap #13)
              path: /ready
              port: 8000
            periodSeconds: 10
            failureThreshold: 6
            # Unset defaults to 1s. One worker serves /health and the scraper on
            # the same event loop, so a GC pause or an image decode was enough to
            # fail a probe.
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: sorinflow
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
