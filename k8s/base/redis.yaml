apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  labels:
    app: redis
    app.kubernetes.io/component: redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app: redis
    app.kubernetes.io/component: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/part-of: sorinflow
        app.kubernetes.io/component: redis
    spec:
      # No token: nothing in this pod ever calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        # Only the seccomp floor, not a fixed runAsUser — same reasoning as
        # postgres.yaml: redis:7-alpine's own entrypoint drops root itself.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --requirepass
            - $(REDIS_PASSWORD)
            # An unbounded Redis grows until the NODE runs out, and then the
            # kubelet chooses what dies. 200mb is enormous for what this holds
            # — verification codes, per-IP budgets, a little cache.
            - --maxmemory
            - 200mb
            # noeviction, deliberately, NOT allkeys-lru. Everything in here
            # either has a TTL or matters: silently evicting a login code the
            # moment memory got tight would look like the SMS never arrived.
            # Refusing the write is loud, and the callers already handle a
            # Redis that says no.
            - --maxmemory-policy
            - noeviction
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sorinflow-secrets
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          # Was BestEffort, like Postgres — evicted first, and it holds every
          # in-flight login code.
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              # Through a shell, so the password is the real one, and grep,
              # because redis-cli exits 0 even when the answer is NOAUTH —
              # the old probe reported ready whether the password worked
              # or not (roadmap #13).
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
    app.kubernetes.io/component: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  clusterIP: None
