# The worker role: consumes the scrape queue (sf:scrape:queue in Redis),
# drives Chromium to talk to Divar, and is the only role the Ingress sends the
# Divar-login HTTP routes to (see ingress.yaml) — those need the same
# Chromium/cookie machinery this role already holds, and api never launches
# a browser at all.
apiVersion: v1
kind: Service
metadata:
  name: worker
  labels:
    app: worker
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  selector:
    app: worker
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
    app.kubernetes.io/component: worker
    sorinflow.com/inject-app-env: "true"
spec:
  replicas: 1
  # RollingUpdate, even at 1 replica — deliberately, unlike the old single
  # pod (see backend.yaml). On SIGTERM this role drains: it stops taking new
  # scrape jobs, lets whatever it is running finish, then exits, so the old
  # and new pod overlapping briefly means two workers each on a DIFFERENT
  # job, not two processes fighting over the same one. The cross-process
  # Chromium profile lock (sf:profile:{account} in Redis) is what actually
  # keeps two workers off the same Divar account's cookies at once — not the
  # deployment strategy.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        app.kubernetes.io/part-of: sorinflow
        app.kubernetes.io/component: worker
        sorinflow.com/egress: app
      annotations:
        sorinflow.com/synced-secrets: "unsynced"
    spec:
      # A running scrape job (Chromium mid-page-load, a login waiting on an
      # SMS code) is let finish, however long it takes: some runs take far
      # longer than the 2 hours this used to be (Sobhan, 1405/07/04:
      # «محدودیت زمانی اسکرپر را بردار»). 7 days is «no limit» for a scrape.
      # Nothing else waits on it: deploy_k8s.sh never waits for the old pod,
      # and the probes below restart a wedged process with their own 60 s.
      terminationGracePeriodSeconds: 604800
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000    # pwuser in the Playwright base image
        runAsGroup: 1000
        fsGroup: 1000
        # data-pvc is a `local` PV, so the kubelet re-applies fsGroup to every
        # file on it at EVERY mount by default — a recursive walk over all the
        # downloaded images on each pod start and rolling update. Once the root
        # is right (the data-ownership Job, then the first mount) there is
        # nothing to fix, so only a mismatched root triggers the walk.
        fsGroupChangePolicy: OnRootMismatch
        # Chromium's own sandbox needs a handful of syscalls
        # RuntimeDefault blocks (unshare/clone with CLONE_NEWUSER, mainly) —
        # see deploy/seccomp/sorinflow-chromium.json for exactly which ones
        # and where it comes from. Without this profile CHROMIUM_SANDBOX=auto
        # falls back to running without a sandbox at all, loudly.
        seccompProfile:
          type: Localhost
          localhostProfile: profiles/sorinflow-chromium.json
      containers:
        - name: worker
          image: ghcr.io/tecso-dev/sorinflow-data-manager:latest
          imagePullPolicy: IfNotPresent
          # SIGTERM stops uvicorn accepting at once, but Traefik keeps routing to
          # the pod until it sees the endpoint go — about a second — and each
          # request in that gap was a 502 (seen on the k3d rehearsal: one burst
          # per replaced pod). The pause lets Traefik catch up first.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8000
          env:
            - name: SORINFLOW_ROLE
              value: "worker"
            - name: DB_MIGRATE_ON_BOOT
              value: "false"
            # DATABASE_URL, SECRET_KEY, the optional provider keys, etc. come
            # from the shared-app-env patch — see backend.yaml's comment and
            # shared-app-env.patch.yaml for the full list.
          volumeMounts:
            - name: app-data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
            # Chromium (as pwuser, not root) writes its cache and config under
            # $HOME. readOnlyRootFilesystem means that has to be a real
            # writable mount, not whatever the image's /home/pwuser resolves
            # to on the base image layer.
            - name: home
              mountPath: /home/pwuser
          # See backend.yaml for the full node-budget accounting. This is the
          # one role that holds Chromium, which is where almost all of it
          # goes.
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "3072Mi"
          # No HTTP health endpoint worth trusting here — the process can be
          # correctly busy inside a page load for a while. Both probes instead
          # check a heartbeat file the process itself touches every <=15s
          # (HEARTBEAT_FILE, default /tmp/sorinflow-heartbeat); a stuck event
          # loop stops updating it and the pod is restarted.
          #
          # The startup probe wants the file FRESH, not merely present: /tmp
          # is an emptyDir, which outlives a container restart. After the
          # server restarted on 1405/07/04 the previous container's file
          # passed «test -f» at once, liveness judged the new process — still
          # booting, 4.5 minutes with everything starting together — by that
          # old file, and the restart it asked for arrived as a SIGTERM that
          # PID 1 could not handle yet. The kill then came at the end of the
          # pod's grace period, two hours later, in the middle of two scrapes.
          # Both probes carry their own 60 s so a restart never waits out the
          # drain window above.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/sorinflow-heartbeat) )) -lt 90
            periodSeconds: 5
            failureThreshold: 120
            terminationGracePeriodSeconds: 60
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/sorinflow-heartbeat) )) -lt 90
            periodSeconds: 30
            failureThreshold: 3
            terminationGracePeriodSeconds: 60
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: data-pvc
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
