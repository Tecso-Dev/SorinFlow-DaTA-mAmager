# The one shared env list for every role that runs the app image: api, worker
# and scheduler (backend.yaml, worker.yaml, scheduler.yaml) and the migrate
# Job (migrate-job.yaml). Applied by the "patches" entry in kustomization.yaml
# that targets everything labelled sorinflow.com/inject-app-env: "true" —
# label-selected, not kind-selected, so one patch reaches three Deployments
# and a Job. Each of those files still sets its OWN SORINFLOW_ROLE and
# DB_MIGRATE_ON_BOOT directly, since those genuinely differ per role; this
# file is only the part that is identical everywhere, so it is defined once
# instead of copied four times and drifting.
#
# A JSON6902 patch, not a strategic-merge one, on purpose: the four targets
# use different container names (api/worker/scheduler/migrate) for
# readability in `kubectl logs -c`, and a strategic-merge patch keyed by
# container name would only match the one target whose container happens to
# share the patch's name — see /spec/template/spec/containers/0 below, which
# works by position instead and does not care what the container is called.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: sorinflow-secrets
        key: DATABASE_URL
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: REDIS_URL
    valueFrom:
      secretKeyRef:
        name: sorinflow-secrets
        key: REDIS_URL
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: sorinflow-secrets
        key: SECRET_KEY
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: API_KEY
    valueFrom:
      secretKeyRef:
        name: sorinflow-secrets
        key: API_KEY
# Everything below is optional: true on purpose. The pod must start when a
# key has never been created — that is the normal state for a provider
# nobody has signed up for yet. Without the entry the variable does not reach
# the container at all, so `kubectl patch secret` for it is a silent no-op:
# the value sits in the Secret and the application never sees it.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: SMTP_HOST
    valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: SMTP_HOST, optional: true } }
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: SMTP_PORT
    valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: SMTP_PORT, optional: true } }
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: SMTP_USER
    valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: SMTP_USER, optional: true } }
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: SMTP_PASSWORD
    valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: SMTP_PASSWORD, optional: true } }
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: KAVENEGAR_API_KEY
    valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: KAVENEGAR_API_KEY, optional: true } }
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: KAVENEGAR_SENDER
    valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: KAVENEGAR_SENDER, optional: true } }
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: KAVENEGAR_OTP_TEMPLATE
    valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: KAVENEGAR_OTP_TEMPLATE, optional: true } }
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: METRICS_TOKEN
    valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: METRICS_TOKEN, optional: true } }
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: TELEGRAM_BOT_TOKEN
    valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: TELEGRAM_BOT_TOKEN, optional: true } }
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: TELEGRAM_CHAT_ID
    valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: TELEGRAM_CHAT_ID, optional: true } }
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: ROOT_PASSWORD
    valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: ROOT_PASSWORD, optional: true } }
# Read by the seed on an empty database. Without this entry a rebuilt server
# seeded its super_admin with the placeholder.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: SUPER_ADMIN_PASSWORD
    valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: SUPER_ADMIN_PASSWORD, optional: true } }
# ── LLM (optional) ──
# Any OpenAI-compatible endpoint. Liara's AI gateway is one:
#   LLM_BASE_URL = https://ai.liara.ir/api/<project-id>/v1
#   LLM_MODEL    = provider/model, e.g. openai/gpt-4.1-mini
# Read by app/config.py and used by match_service._llm_rerank.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: LLM_API_KEY
    valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: LLM_API_KEY, optional: true } }
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: LLM_BASE_URL
    valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: LLM_BASE_URL, optional: true } }
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: LLM_MODEL
    valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: LLM_MODEL, optional: true } }
# Which model does which job (app/config.py; read by the AI agents). LLM_MODEL
# above is the one that writes Persian for people to read; these read, look
# and embed. Plain settings, not secrets.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: LLM_MODEL_READ
    value: "openai/gpt-4.1-mini"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: LLM_MODEL_VISION
    value: "openai/gpt-4.1-mini"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: LLM_MODEL_EMBED
    value: "openai/text-embedding-3-small"
# Liara's account token — read-only use: the account's credit and the AI
# project's usage on the panel's AI card. It can do far more than that (it is
# the console's own power), so it is short-lived and rotated, never shown,
# and never used for anything but GETs.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: LIARA_API_TOKEN
    valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: LIARA_API_TOKEN, optional: true } }
# ── proxies ──
# Default false in config.py. Without this entry the switch could not be
# thrown from the cluster: a proxy was configured and tested in the panel for
# days and never used by a single request.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: PROXY_ENABLED
    valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: PROXY_ENABLED, optional: true } }
# ── phone-side SMS forwarder ──
# The forwarder app signs each POST with this. Unset = the inbound endpoints
# answer 503 and codes are entered by hand, as before.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: OTP_INBOUND_SECRET
    valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: OTP_INBOUND_SECRET, optional: true } }
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: OTP_RESEND_AFTER_SECONDS
    valueFrom: { secretKeyRef: { name: sorinflow-secrets, key: OTP_RESEND_AFTER_SECONDS, optional: true } }
# ── the visitor portal ──
#
# Ships OFF. With it false, /portal redirects to the dashboard and every
# /api/public/auth/* endpoint answers 404, so the sign-up flow cannot be
# reached even by URL. Flip it to "true" only when a delivery channel is
# actually configured — a portal that takes a registration and then cannot
# send the code is worse than one that is closed.
#
# Not a secret, so it lives here rather than in the Secret.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: PUBLIC_AUTH_ENABLED
    value: "true"
# Which channel carries the login code. verification.py falls back to the
# other one if this fails, so this is a preference, not a hard route.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: AUTH_SMS_PROVIDER
    value: "kavenegar"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: ENVIRONMENT
    value: "production"
# The shared data volume, not each role's own /app/logs (removed from the
# volumes below): a log file private to one pod's ephemeral filesystem was
# never visible to anyone but that pod, so the panel's log viewer
# (GET /api/stats/logs) only ever showed whichever role and replica happened
# to serve the request — api reading its own empty file, never worker's
# scrape log. data-pvc is mounted read-write on api/worker/scheduler already.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: LOGS_PATH
    value: "/app/data/logs"
# The node's own address, from Kubernetes — not a hard-coded string, which
# once left the monitoring page reporting the old server's IP for hours after
# a move to a new one. fieldRef is evaluated per-pod by the kubelet, so this
# is safe to share across api/worker/scheduler/migrate: each pod gets its own.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: SERVER_IP
    valueFrom:
      fieldRef:
        fieldPath: status.hostIP
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: DOMAIN
    value: "sorinflow.com"
