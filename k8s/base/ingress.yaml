apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  labels:
    app.kubernetes.io/component: ingress
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sorinflow-ingress-http
  labels:
    app.kubernetes.io/component: ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
    # Traefik's cross-namespace middleware reference is "<namespace>-<name>":
    # the production overlay's namespace is "sorinflow", so this is correct
    # as written; the staging overlay patches it to match "sorinflow-staging".
    traefik.ingress.kubernetes.io/router.middlewares: "sorinflow-redirect-https@kubernetescrd"
spec:
  ingressClassName: traefik
  rules:
    - host: sorinflow.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sorinflow-ingress-https
  labels:
    app.kubernetes.io/component: ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: "letsencrypt"
spec:
  ingressClassName: traefik
  rules:
    - host: sorinflow.com
      http:
        paths:
          # Exact, and listed before the catch-all Prefix rule for a human
          # reading this file — Ingress path precedence does not actually
          # depend on order (Exact always outranks Prefix per the spec, and
          # Traefik follows it), but relying on that is not a reason to make
          # the file confusing to read.
          #
          # These three are the only Divar-login HTTP routes the panel calls
          # (frontend/js/app.js: apiCall('/auth/login'), apiCall('/auth/verify
          # ?phone_number=...'), apiCall('/auth/refresh'); API_BASE is '/api').
          # They need worker's Chromium/cookie machinery, which api does not
          # have — see worker.yaml.
          - path: /api/auth/login
            pathType: Exact
            backend:
              service:
                name: worker
                port:
                  number: 8000
          - path: /api/auth/verify
            pathType: Exact
            backend:
              service:
                name: worker
                port:
                  number: 8000
          - path: /api/auth/refresh
            pathType: Exact
            backend:
              service:
                name: worker
                port:
                  number: 8000
          # ── what stays on the backend ──
          #
          # Everything not named here goes to web (sorinflow-ingress-web
          # below), so this list is exhaustive on purpose: a path left out of
          # it does not fall back to the backend, it 404s out of Next.
          #
          # These outrank the catch-all because it sits in its own Ingress at
          # priority 1 — not because they are longer or Exact: Traefik ranks
          # by rule length, see sorinflow-ingress-web.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # The old panel, kept reachable for two weeks after the switchover
          # so anyone mid-task can finish there. Its manifest and icons are
          # relative, so they ride along under this prefix; its <link rel=icon>
          # is not — hence /favicon.svg below.
          - path: /dashboard
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Property photos, the forwarder APK and the mail hero images: three
          # StaticFiles mounts in app/main.py, and nothing Next knows about.
          - path: /images
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /downloads
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /email-assets
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Probes, the way back in during maintenance, the crawler file Next
          # has no route for, and the icon the old panel and the API's own
          # error pages link to absolutely.
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /maintenance-access
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /llms.txt
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # The retired Kavenegar push worker. It answers with a worker that
          # unregisters itself, for browsers that still have the old one
          # installed at scope "/" — routed to the new site it would 404 and
          # leave that registration in place. Remove with the route.
          - path: /kvn-push-sw.js
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /favicon.svg
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
---
# ── everything else is the new site (web.yaml) ──
#
# The landing page, the customer portal, the new panel and its /_next assets,
# robots.txt, sitemap.xml, og.png, favicon.ico, the PWA icons, the service
# worker and the per-scope manifests. This is the switchover: before it, / was
# the old landing page on the backend and only /panel and /_next came here.
#
# Its own Ingress, at the lowest priority, and not a path in the one above:
# Traefik does not rank an Ingress's paths the way the Ingress spec does
# (Exact first, then the longest Prefix). Each path becomes a router whose
# rule is `Host(...) && Path(...)` or `Host(...) && PathPrefix(...)`, and
# routers are ranked by the LENGTH of that rule text. PathPrefix(`/`) is 15
# characters, as long as Path(`/health`) and longer than Path(`/ready`), so
# with the catch-all beside them /health tied with the new site and /ready
# lost to it: the phase 4 deploy's own check got Next's 404 for /health and
# stopped. The router.priority annotation applies to a whole Ingress, so the
# catch-all sits alone here at priority 1, below every rule of the Ingress
# above (the shortest, Host + Path, is far longer than 1).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sorinflow-ingress-web
  labels:
    app.kubernetes.io/component: ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: "letsencrypt"
    traefik.ingress.kubernetes.io/router.priority: "1"
spec:
  ingressClassName: traefik
  rules:
    - host: sorinflow.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
