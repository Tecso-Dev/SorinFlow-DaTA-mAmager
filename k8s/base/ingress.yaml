apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  labels:
    app.kubernetes.io/component: ingress
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sorinflow-ingress-http
  labels:
    app.kubernetes.io/component: ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
    # Traefik's cross-namespace middleware reference is "<namespace>-<name>":
    # the production overlay's namespace is "sorinflow", so this is correct
    # as written; the staging overlay patches it to match "sorinflow-staging".
    traefik.ingress.kubernetes.io/router.middlewares: "sorinflow-redirect-https@kubernetescrd"
spec:
  ingressClassName: traefik
  rules:
    - host: sorinflow.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sorinflow-ingress-https
  labels:
    app.kubernetes.io/component: ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: "letsencrypt"
spec:
  ingressClassName: traefik
  rules:
    - host: sorinflow.com
      http:
        paths:
          # Exact, and listed before the catch-all Prefix rule for a human
          # reading this file — Ingress path precedence does not actually
          # depend on order (Exact always outranks Prefix per the spec, and
          # Traefik follows it), but relying on that is not a reason to make
          # the file confusing to read.
          #
          # These three are the only Divar-login HTTP routes the panel calls
          # (frontend/js/app.js: apiCall('/auth/login'), apiCall('/auth/verify
          # ?phone_number=...'), apiCall('/auth/refresh'); API_BASE is '/api').
          # They need worker's Chromium/cookie machinery, which api does not
          # have — see worker.yaml.
          - path: /api/auth/login
            pathType: Exact
            backend:
              service:
                name: worker
                port:
                  number: 8000
          - path: /api/auth/verify
            pathType: Exact
            backend:
              service:
                name: worker
                port:
                  number: 8000
          - path: /api/auth/refresh
            pathType: Exact
            backend:
              service:
                name: worker
                port:
                  number: 8000
          # ── what stays on the backend ──
          #
          # Everything not named here goes to web (the last rule), so this
          # list is exhaustive on purpose: a path left out of it does not
          # fall back to the backend, it 404s out of Next.
          #
          # Ingress picks the LONGEST matching path, not the first one in the
          # file, so these outrank the catch-all wherever they overlap.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # The old panel, kept reachable for two weeks after the switchover
          # so anyone mid-task can finish there. Its manifest and icons are
          # relative, so they ride along under this prefix; its <link rel=icon>
          # is not — hence /favicon.svg below.
          - path: /dashboard
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Property photos, the forwarder APK and the mail hero images: three
          # StaticFiles mounts in app/main.py, and nothing Next knows about.
          - path: /images
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /downloads
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /email-assets
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Probes, the way back in during maintenance, the crawler file Next
          # has no route for, and the icon the old panel and the API's own
          # error pages link to absolutely.
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /maintenance-access
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /llms.txt
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # The retired Kavenegar push worker. It answers with a worker that
          # unregisters itself, for browsers that still have the old one
          # installed at scope "/" — routed to the new site it would 404 and
          # leave that registration in place. Remove with the route.
          - path: /kvn-push-sw.js
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /favicon.svg
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Everything else is the new site — see sorinflow-ingress-catchall
          # at the end of this file, and the comment there for why it is separate.
---
# The catch-all, on a router of its own with an explicit low priority.
#
# Traefik does not rank Ingress paths by how specific they are. Each path
# becomes a router whose default priority is the LENGTH of its rule string,
# and `PathPrefix(`/`)` is 15 characters — so every Exact rule shorter than
# that loses to it:
#
#   Path(`/ready`)        14  lost
#   Path(`/health`)       15  tied, and lost
#   PathPrefix(`/`)       15
#   Path(`/llms.txt`)     17  won
#   Path(`/favicon.svg`)  20  won
#
# Not a theory. After the phase-4 switchover /health and /ready answered from
# Next with a 404 on the live site; scripts/deploy_k8s.sh verifies itself by
# probing /health, so the deploy failed at its last step and — by design —
# deleted every NetworkPolicy rather than leave traffic broken by a change it
# could not confirm.
#
# priority: 1 is below any length Traefik would compute, so the named list in
# the Ingress above always wins and nothing depends on how long a path happens
# to be. It has to be a separate Ingress because the annotation sets the
# priority for every router an Ingress produces, and the rest must keep theirs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sorinflow-ingress-catchall
  labels:
    app.kubernetes.io/component: ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.priority: "1"
spec:
  ingressClassName: traefik
  rules:
    - host: sorinflow.com
      http:
        paths:
          # The landing page, the customer portal, the new panel and its
          # /_next assets, robots.txt, sitemap.xml, og.png, favicon.ico, the
          # PWA icons, the service worker and the per-scope manifests.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
